name: CI

on:
  push:
    branches: [feat/**, fix/**, dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: lcsp
          # Derived per run: the service password is throwaway and must not be a
          # literal that looks like a committed credential.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: lcsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcsp -d lcsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://lcsp:ci-${{ github.run_id }}@localhost:5432/lcsp
      DATABASE_URL_TEST: postgresql+asyncpg://lcsp:ci-${{ github.run_id }}@localhost:5432/lcsp_test
      NAN_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict app tests
      - run: uv run ruff check ../evals
      - run: uv run ruff format --check ../evals
      - run: uv run mypy --strict ../evals
      - run: uv run alembic upgrade head
      - name: Create the dedicated test database
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import re

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          admin_url, database = os.environ["DATABASE_URL_TEST"].rsplit("/", 1)
          target = database.split("?", 1)[0]

          # The name is interpolated into a quoted CREATE DATABASE identifier,
          # and Postgres accepts almost anything inside double quotes (even
          # `;`): a malformed URL would silently create a garbage database
          # instead of failing. Only plain identifiers are allowed through.
          if not re.fullmatch(r"[A-Za-z0-9_]+", target):
              raise SystemExit(
                  f"Refusing to create a test database with the unsafe name {target!r}: "
                  "DATABASE_URL_TEST must end in a plain database name."
              )

          async def main() -> None:
              engine = create_async_engine(admin_url + "/lcsp", isolation_level="AUTOCOMMIT")
              async with engine.connect() as connection:
                  exists = await connection.scalar(
                      text("SELECT 1 FROM pg_database WHERE datname = :name"), {"name": target}
                  )
                  if exists is None:
                      await connection.execute(text(f'CREATE DATABASE "{target}"'))
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Migrate the test database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - run: uv run pytest
      - run: uv run pytest tests/integration

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright, stubbed API)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps
      - name: Run e2e tests
        working-directory: frontend
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
